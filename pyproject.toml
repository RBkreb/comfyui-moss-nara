[project]
name = "comfyui-moss-nara"
version = "0.2.0"
description = "NaRA (noise-aware rank adaptation) loader and sigma-aware KSampler for MOSS-Image in ComfyUI"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# torch and safetensors ship with ComfyUI; no extra third-party runtime deps.
dependencies = []
readme = "README.md"

[tool.comfy]
PublisherId = "rbkrebs"
DisplayName = "MOSS-Image NaRA"
# Needs comfy.model_base.MOSSImage, added in v0.42.0.
requires-comfyui = ">=0.42.0"